etween;gap:20px}.invoice-paper img{width:190px;max-height:140px;object-fit:contain;object-position:left top}.paper-meta{text-align:right}.paper-meta h1{font-size:32px;color:#2050ab}.paper-to{margin:32px 0}.invoice-paper table th{background:#edf2f9}.invoice-paper td{vertical-align:top}.paper-total{text-align:right;font-size:20px;margin:22px 0}.note{font-size:13px;color:#64748b}.help{background:#eef4ff;border-radius:9px;padding:12px;color:#3d5680;font-size:13px}.hidden{display:none!important}@media(max-width:700px){.wrap{padding:15px}header .wrap{align-items:flex-start;flex-direction:column}.cards{grid-template-columns:repeat(2,1fr)}.card strong{font-size:21px}.panel{padding:14px}.table-scroll{overflow-x:auto}table{min-width:650px}.grid{grid-template-columns:1fr}.line{grid-template-columns:1fr 54px 76px 65px 30px;gap:4px}.line input{padding:8px 4px}.modal{padding:17px}.invoice-paper{padding:24px}}@media print{body{background:white}header,main,.modal-head,.actions,.no-print{display:none!important}.modal-back{position:static;display:block!important;background:white;padding:0}.modal{display:block;width:100%!important;max-height:none;overflow:visible;border:0;box-shadow:none;padding:0}.invoice-paper{max-width:none;padding:20px 35px}@page{size:letter;margin:.4in}}
</style></head><body><header><div class="wrap"><div class="brand"><img src="logo.png" alt="Table Rock Services"><span>Invoice tracker</span></div><div class="toolbar"><button class="btn" id="clientsBtn">Clients</button><button class="btn" id="backupBtn">Backup / Restore</button></div></div></header><main class="wrap"><div class="top"><div><h1>Invoices</h1><p class="muted">Create, print, and track payments in one place.</p></div><button class="btn primary" id="newBtn">+ New Invoice</button></div><div class="cards"><div class="card"><small>Outstanding</small><strong id="outstanding">$0.00</strong></div><div class="card"><small>Overdue</small><strong id="overdue">$0.00</strong></div><div class="card"><small>Received this year</small><strong id="received">$0.00</strong></div><div class="card"><small>Invoiced this year</small><strong id="invoiced">$0.00</strong></div></div><section class="panel"><div class="filters"><input id="search" placeholder="Search invoice, client, or description" aria-label="Search invoices"><select id="status"><option value="all">All invoices</option><option value="open">Outstanding</option><option value="late">Overdue</option><option value="paid">Paid</option></select><select id="year" aria-label="Year"></select></div><div class="table-scroll"><table><thead><tr><th>Invoice</th><th>Client</th><th>Date</th><th>Due</th><th class="money">Total</th><th class="money">Balance</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><div class="modal-back" id="overlay"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div><script>
const KEY='tablerock-invoices-v1';let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{};if(!data||!Array.isArray(data.invoices))data={invoices:[],clients:[]};data.clients ||= [];
const $=s=>document.querySelector(s),money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n)||0),today=()=>new Date().toLocaleDateString('en-CA'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),date=s=>s?new Date(s+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—',cents=n=>Math.round((Number(n)||0)*100),total=i=>i.lines.reduce((a,l)=>a+cents(l.qty)*cents(l.rate)/100,0),paid=i=>i.payments.reduce((a,p)=>a+cents(p.amount),0),balance=i=>Math.max(0,Math.round(total(i)-paid(i)))/100,status=i=>!balance(i)?'Paid':i.due&&i.due<today()?'Overdue':paid(i)?'Partial':'Unpaid',save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('Could not save. Browser storage may be full. Export a backup now.')}};
function nextNumber(){let y=new Date().getFullYear(),max=data.invoices.filter(i=>i.number?.startsWith(y+'-')).reduce((n,i)=>Math.max(n,Number(i.number.split('-').pop())||0),99);return y+'-'+(max+1)}
function render(){let y=$('#year').value||String(new Date().getFullYear()),years=[...new Set([String(new Date().getFullYear()),...data.invoices.map(i=>i.date.slice(0,4))])].sort((a,b)=>b-a);$('#year').innerHTML=years.map(v=>`<option ${v===y?'selected':''}>${v}</option>`).join('');let all=data.invoices,search=$('#search').value.toLowerCase(),filter=$('#status').value;let shown=all.filter(i=>i.date.startsWith(y)&&`${i.number} ${i.clientName} ${i.lines.map(l=>l.description).join(' ')}`.toLowerCase().includes(search)&& (filter==='all'||filter==='paid'&&status(i)==='Paid'||filter==='late'&&status(i)==='Overdue'||filter==='open'&&balance(i)>0)).sort((a,b)=>b.date.localeCompare(a.date)||b.number.localeCompare(a.number));$('#outstanding').textContent=money(all.reduce((a,i)=>a+balance(i),0));$('#overdue').textContent=money(all.filter(i=>status(i)==='Overdue').reduce((a,i)=>a+balance(i),0));$('#received').textContent=money(all.flatMap(i=>i.payments).filter(p=>p.date.startsWith(y)).reduce((a,p)=>a+Number(p.amount),0));$('#invoiced').textContent=money(all.filter(i=>i.date.startsWith(y)).reduce((a,i)=>a+total(i)/100,0));$('#rows').innerHTML=shown.length?shown.map(i=>`<tr class="row" data-id="${esc(i.id)}"><td><b>${esc(i.number)}</b></td><td>${esc(i.clientName)}</td><td>${date(i.date)}</td><td>${date(i.due)}</td><td class="money">${money(total(i)/100)}</td><td class="money"><b>${money(balance(i))}</b></td><td><span class="pill ${status(i)==='Paid'?'paid':status(i)==='Overdue'?'late':status(i)==='Partial'?'partial':'open'}">${status(i)}</span></td></tr>`).join(''):`<tr><td colspan="7" class="empty">${data.invoices.length?'No invoices match these filters.':'No invoices yet. Choose New Invoice to get started.'}</td></tr>`}
function modal(html,wide=false){$('#modal').className='modal'+(wide?' wide':'');$('#modal').innerHTML=html;$('#overlay').classList.add('show');$('#modal').scrollTop=0}function close(){ $('#overlay').classList.remove('show');$('#modal').innerHTML='' }document.addEventListener('click',e=>{if(e.target.id==='overlay'||e.target.classList.contains('x'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
function lineHTML(l={description:'',qty:1,rate:0}){return `<div class="line"><input class="desc" placeholder="Work or service" value="${esc(l.description)}" required><input class="qty" type="number" min="0" step="any" aria-label="Quantity" value="${esc(l.qty)}" required><input class="rate" type="number" min="0" step=".01" aria-label="Rate" value="${esc(l.rate)}" required><span class="amount">$0.00</span><button type="button" class="icon remove" aria-label="Remove line">×</button></div>`}
function editor(i){let editing=!!i?.id,existing=i||{number:nextNumber(),date:today(),due:'',clientName:'',clientAddress:'',notes:'',lines:[{description:'',qty:1,rate:0}],payments:[]};modal(`<div class="modal-head"><div><h2>${editing?'Edit invoice':'New invoice'}</h2><span class="muted">Saved invoices appear automatically in the ledger.</span></div><button class="x" aria-label="Close">×</button></div><form id="invoiceForm"><div class="grid"><div class="field"><label>Invoice number</label><input name="number" required value="${esc(existing.number)}"></div><div class="field"><label>Invoice date</label><input name="date" type="date" required value="${esc(existing.date)}"></div><div class="field"><label>Client</label><input name="clientName" list="clientNames" required placeholder="Select or type a client" value="${esc(existing.clientName)}"><datalist id="clientNames">${data.clients.map(c=>`<option value="${esc(c.name)}">`).join('')}</datalist></div><div class="field"><label>Due date <span class="muted">(optional)</span></label><input name="due" type="date" value="${esc(existing.due)}"></div></div><div class="field"><label>Bill to address <span class="muted">(optional)</span></label><textarea name="clientAddress" placeholder="Street, city, state and ZIP">${esc(existing.clientAddress)}</textarea></div><h2>Work performed</h2><div id="lines">${existing.lines.map(lineHTML).join('')}</div><button class="btn" type="button" id="addLine">+ Add line</button><div class="total">Total: <span id="formTotal">$0.00</span></div><div class="field"><label>Invoice note <span class="muted">(optional)</span></label><textarea name="notes" placeholder="Additional details for the client">${esc(existing.notes)}</textarea></div><div class="actions"><button type="button" class="btn" id="cancel">Cancel</button><button class="btn primary" type="submit">${editing?'Save changes':'Save invoice'}</button></div></form>`,true);let form=$('#invoiceForm'),update=()=>{let sum=0;form.querySelectorAll('.line').forEach(row=>{let a=Math.max(0,cents(row.querySelector('.qty').value)*cents(row.querySelector('.rate').value)/100);row.querySelector('.amount').textContent=money(a/100);sum+=a});$('#formTotal').textContent=money(sum/100)};update();form.addEventListener('input',update);$('#addLine').onclick=()=>{$('#lines').insertAdjacentHTML('beforeend',lineHTML());update()};$('#lines').onclick=e=>{if(e.target.classList.contains('remove')){if($('#lines').children.length===1)return alert('Keep at least one line.');e.target.closest('.line').remove();update()}};$('#cancel').onclick=close;form.elements.clientName.onchange=()=>{let c=data.clients.find(c=>c.name.toLowerCase()===form.elements.clientName.value.trim().toLowerCase());if(c)form.elements.clientAddress.value=c.address||''};form.onsubmit=e=>{e.preventDefault();let f=form.elements,n=f.number.value.trim(),name=f.clientName.value.trim(),lines=[...form.querySelectorAll('.line')].map(r=>({description:r.querySelector('.desc').value.trim(),qty:Number(r.querySelector('.qty').value),rate:Number(r.querySelector('.rate').value)}));if(data.invoices.some(x=>x.number.toLowerCase()===n.toLowerCase()&&x.id!==i?.id))return alert('That invoice number is already used.');if(lines.some(l=>!l.description||!Number.isFinite(l.qty)||l.qty<=0||!Number.isFinite(l.rate)||l.rate<0))return alert('Enter a description, quantity above zero, and a valid rate for each line.');let updated={id:i?.id||crypto.randomUUID(),number:n,date:f.date.value,due:f.due.value,clientName:name,clientAddress:f.clientAddress.value.trim(),notes:f.notes.value.trim(),lines,payments:i?.payments||[]};if(editing){if(paid(i)>total(updated))return alert('The new total is less than payments already recorded.');data.invoices[data.invoices.findIndex(x=>x.id===i.id)]=updated}else data.invoices.push(updated);let client=data.clients.find(c=>c.name.toLowerCase()===name.toLowerCase());if(client)client.address=updated.clientAddress;else data.clients.push({name,address:updated.clientAddress});save();render();detail(updated.id)}}
function detail(id){let i=data.invoices.find(x=>x.id===id);if(!i)return;modal(`<div class="modal-head"><div><h2>Invoice ${esc(i.number)}</h2><span class="muted">${esc(i.clientName)} · ${date(i.date)}</span></div><button class="x" aria-label="Close">×</button></div><div class="detail-head"><div><span class="pill ${status(i)==='Paid'?'paid':status(i)==='Overdue'?'late':status(i)==='Partial'?'partial':'open'}">${status(i)}</span><p class="muted">${i.due?'Due '+date(i.due):'No due date'}</p></div><div style="text-align:right"><div class="muted">Balance due</div><div class="detail-sum">${money(balance(i))}</div><div class="muted">of ${money(total(i)/100)} total</div></div></div><h2 style="margin-top:20px">Work</h2>${i.lines.map(l=>`<div class="payment"><span>${esc(l.description)} <span class="muted">· ${esc(l.qty)} × ${money(l.rate)}</span></span><b>${money(l.qty*l.rate)}</b></div>`).join('')}<h2 style="margin-top:25px">Payments</h2>${i.payments.length?i.payments.map(p=>`<div class="payment"><span>${date(p.date)} <span class="muted">${esc(p.method||'')}${p.note?' · '+esc(p.note):''}</span></span><span>${money(p.amount)} <button class="icon removePayment" data-payment="${esc(p.id)}" title="Remove payment">×</button></span></div>`).join(''):'<p class="muted">No payments recorded.</p>'}<div class="actions"><button class="btn danger" id="deleteInvoice">Delete</button><button class="btn" id="duplicate">Duplicate</button><button class="btn" id="editInvoice">Edit</button><button class="btn" id="printInvoice">Print / PDF</button>${balance(i)?'<button class="btn primary" id="payInvoice">Record payment</button>':''}</div>`,true);$('#editInvoice').onclick=()=>editor(i);$('#duplicate').onclick=()=>editor({...i,id:undefined,number:nextNumber(),date:today(),due:'',payments:[]});$('#printInvoice').onclick=()=>printInvoice(id);$('#deleteInvoice').onclick=()=>{if(confirm(`Delete invoice ${i.number} and its payment history?`)){data.invoices=data.invoices.filter(x=>x.id!==id);save();close();render()}};$('#payInvoice')?.addEventListener('click',()=>payment(id));document.querySelectorAll('.removePayment').forEach(b=>b.onclick=()=>{if(confirm('Remove this payment?')){i.payments=i.payments.filter(p=>p.id!==b.dataset.payment);save();render();detail(id)}})}
function payment(id){let i=data.invoices.find(x=>x.id===id);modal(`<div class="modal-head"><div><h2>Record payment</h2><span class="muted">Invoice ${esc(i.number)} · Balance ${money(balance(i))}</span></div><button class="x" aria-label="Close">×</button></div><form id="payForm"><div class="grid"><div class="field"><label>Amount received</label><input name="amount" type="number" min="0.01" max="${balance(i)}" step=".01" value="${balance(i)}" required></div><div class="field"><label>Date received</label><input name="date" type="date" value="${today()}" required></div></div><div class="field"><label>Method <span class="muted">(optional)</span></label><select name="method"><option value="">Select method</option><option>Check</option><option>Cash</option><option>Bank transfer</option><option>Other</option></select></div><div class="field"><label>Note <span class="muted">(optional)</span></label><input name="note"></div><div class="actions"><button class="btn" type="button" id="cancel">Cancel</button><button class="btn primary">Save payment</button></div></form>`);$('#cancel').onclick=()=>detail(id);$('#payForm').onsubmit=e=>{e.preventDefault();let f=e.target.elements,a=Number(f.amount.value);if(!Number.isFinite(a)||cents(a)<=0||cents(a)>cents(balance(i)))return alert('Amount must be greater than zero and no more than the current balance.');i.payments.push({id:crypto.randomUUID(),amount:Math.round(a*100)/100,date:f.date.value,method:f.method.value,note:f.note.value.trim()});save();render();detail(id)}}
function printInvoice(id){let i=data.invoices.find(x=>x.id===id);modal(`<div class="modal-head no-print"><h2>Print preview</h2><button class="x" aria-label="Close">×</button></div><div class="invoice-paper"><div class="paper-top"><div><img src="logo.png" alt="Table Rock Services"><p>1117 Coachman Dr<br>Central Point, OR 97502</p></div><div class="paper-meta"><h1>INVOICE</h1><p><b># ${esc(i.number)}</b><br>Date: ${date(i.date)}<br>${i.due?'Due: '+date(i.due):''}</p></div></div><div class="paper-to"><b>Bill To</b><p>${esc(i.clientName)}<br>${esc(i.clientAddress).replace(/\n/g,'<br>')}</p></div><table><thead><tr><th>Description</th><th class="money">Qty</th><th class="money">Rate</th><th class="money">Amount</th></tr></thead><tbody>${i.lines.map(l=>`<tr><td>${esc(l.description).replace(/\n/g,'<br>')}</td><td class="money">${esc(l.qty)}</td><td class="money">${money(l.rate)}</td><td class="money">${money(l.qty*l.rate)}</td></tr>`).join('')}</tbody></table><div class="paper-total"><div>Total: <b>${money(total(i)/100)}</b></div>${paid(i)?`<div>Payments received: −${money(paid(i)/100)}</div>`:''}<div><b>Balance Due: ${money(balance(i))}</b></div></div>${i.notes?`<p>${esc(i.notes).replace(/\n/g,'<br>')}</p>`:''}<p class="note">Make checks payable to Table Rock Services</p></div><div class="actions no-print"><button class="btn" id="back">Back</button><button class="btn primary" id="print">Print / Save PDF</button></div>`,true);$('#back').onclick=()=>detail(id);$('#print').onclick=()=>window.print()}
function clients(){modal(`<div class="modal-head"><h2>Clients</h2><button class="x" aria-label="Close">×</button></div><p class="muted">Saved automatically when you create an invoice. Select a client to edit its billing address.</p><div id="clientList">${data.clients.length?data.clients.sort((a,b)=>a.name.localeCompare(b.name)).map((c,j)=>`<div class="payment"><span><b>${esc(c.name)}</b><br><span class="muted">${esc(c.address||'No billing address')}</span></span><button class="btn clientEdit" data-name="${esc(c.name)}">Edit</button></div>`).join(''):'<p class="muted">No clients yet.</p>'}</div>`);document.querySelectorAll('.clientEdit').forEach(b=>b.onclick=()=>{let c=data.clients.find(x=>x.name===b.dataset.name),name=prompt('Client name',c.name);if(name===null)return;name=name.trim();if(!name)return alert('Name is required.');if(data.clients.some(x=>x!==c&&x.name.toLowerCase()===name.toLowerCase()))return alert('That client already exists.');let address=prompt('Billing address (use commas between lines)',(c.address||'').replace(/\n/g,', '));if(address===null)return;let old=c.name;c.name=name;c.address=address.replace(/,\s*/g,'\n');data.invoices.forEach(i=>{if(i.clientName===old){i.clientName=name;i.clientAddress=c.address}});save();render();clients()})}
function backup(){modal(`<div class="modal-head"><h2>Backup / Restore</h2><button class="x" aria-label="Close">×</button></div><div class="help">Invoices are saved in this browser on this device. Export a backup regularly. GitHub Pages does not sync data between computers or phones.</div><div class="actions" style="justify-content:flex-start"><button class="btn primary" id="export">Download backup</button><label class="btn" for="import">Restore backup</label><input class="hidden" type="file" id="import" accept=".json,application/json"></div><p class="note">Restoring replaces the invoices and clients currently saved in this browser.</p>`);$('#export').onclick=()=>{let blob=new Blob([JSON.stringify({format:'tablerock-invoices-v1',exportedAt:new Date().toISOString(),...data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`tablerock-invoices-backup-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#import').onchange=async e=>{try{let x=JSON.parse(await e.target.files[0].text());if(!Array.isArray(x.invoices)||!Array.isArray(x.clients)||x.invoices.some(i=>!Array.isArray(i.lines)||!Array.isArray(i.payments)))throw Error('Invalid backup file');if(!confirm(`Restore ${x.invoices.length} invoices? This replaces data in this browser.`))return;data={invoices:x.invoices,clients:x.clients};save();close();render()}catch(err){alert('Could not restore: '+err.message)}}}
$('#newBtn').onclick=()=>editor();$('#clientsBtn').onclick=clients;$('#backupBtn').onclick=backup;$('#rows').onclick=e=>{let r=e.target.closest('tr[data-id]');if(r)detail(r.dataset.id)};['search','status','year'].forEach(x=>$('#'+x).addEventListener(x==='search'?'input':'change',render));render();
</script></body></html>
